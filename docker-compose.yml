version: '3.8'

services:
  ika_robot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ika_robot:latest
    container_name: ika_robot

    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=42
      - DISPLAY=${DISPLAY}

    privileged: true
    network_mode: host

    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./recordings:/ros2_ws/recordings
      - ./weights:/ros2_ws/weights

    # command: >
    #  ros2 launch ika_bringup full_system.launch.py
    #    use_cameras:=true
    #    use_lidar:=true
    #    use_stm32:=true

    command: >
      ros2 launch ika_bringup dry_run_full.launch.py

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "bash", "-c", "ros2 topic list | grep -q /system/mode"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ika_manual:
    extends:
      service: ika_robot
    container_name: ika_manual
    command: >
      ros2 launch ika_bringup manual_run.launch.py
        use_cameras:=true
        use_lidar:=true
        use_stm32:=true
    profiles:
      - manual

  ika_autonomous:
    extends:
      service: ika_robot
    container_name: ika_autonomous
    command: >
      ros2 launch ika_bringup autonomous_run.launch.py
        use_cameras:=true
        use_lidar:=true
        use_stm32:=true
    profiles:
      - autonomous

  # Debug: container içine shell aç
  ika_shell:
    extends:
      service: ika_robot
    container_name: ika_shell
    command: bash
    stdin_open: true
    tty: true
    restart: "no"
    profiles:
      - debug
